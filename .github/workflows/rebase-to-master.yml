name: Rebase to Master

on:
  workflow_dispatch:
    inputs:
      allow_diverged:
        description: 'Rebase even when master holds commits of its own'
        type: boolean
        default: false

run-name: "Rebase ${{ github.ref_name }} to master"

jobs:
  rebase:
    uses: valkyrjaio/.github/.github/workflows/_rebase-to-master.yml@06472907a89cf175883fb9f82d5903fb0b43bea4
    permissions:
      contents: write
    secrets: inherit
    with:
      allow_diverged: ${{ inputs.allow_diverged }}
